name: LanjingQuiz
options:
  bundleIdPrefix: com.qzh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_TESTABILITY: YES
targets:
  LanjingQuiz:
    type: application
    platform: iOS
    sources:
      - LanjingQuiz
    info:
      path: LanjingQuiz/Info.plist
      properties:
        CFBundleDisplayName: "蓝鲸助手"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow plain-HTTP self-hosted CookieCloud servers on the local
        # network (IP literals / .local). Loopback is always exempt; this
        # does NOT enable NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "用于连接局域网内自建的 CookieCloud 服务以同步登录会话。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qzh.lanjingquiz
        PRODUCT_NAME: LanjingQuiz
        GENERATE_INFOPLIST_FILE: NO
        # Signing team, injected via the DEVELOPMENT_TEAM environment variable
        # at generation time (e.g. DEVELOPMENT_TEAM=XXXXX xcodegen generate).
        # Never commit a concrete team ID: it is personal developer info.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LanjingQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LanjingQuizTests
    dependencies:
      - target: LanjingQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: LanjingQuizTests
        PRODUCT_BUNDLE_IDENTIFIER: com.qzh.lanjingquiz.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LanjingQuiz.app/LanjingQuiz"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LanjingQuizUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LanjingQuizUITests
    dependencies:
      - target: LanjingQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: LanjingQuizUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.qzh.lanjingquiz.uitests
        TEST_TARGET_NAME: LanjingQuiz
schemes:
  LanjingQuiz:
    build:
      targets:
        LanjingQuiz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LanjingQuizTests
        - LanjingQuizUITests
