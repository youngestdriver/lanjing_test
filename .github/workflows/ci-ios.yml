name: CI iOS

# The workflow always runs and the iOS job itself is conditionally skipped:
# GitHub auto-passes required checks whose job was skipped, but it does NOT
# auto-pass checks whose workflow never ran (path-filtered runs). Without
# this, a web-only PR would stay BLOCKED waiting for the "iOS" check forever.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect iOS changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - "apps/ios/**"
              - ".github/workflows/ci-ios.yml"

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          simulator_runtime="com.apple.CoreSimulator.SimRuntime.iOS-${simulator_sdk//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$simulator_runtime" \
                '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid'
          )"

          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -project apps/ios/LanjingQuiz.xcodeproj \
            -scheme LanjingQuiz \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/LanjingQuizDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
