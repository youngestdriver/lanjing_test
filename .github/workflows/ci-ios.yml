name: CI iOS

on:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - ".github/workflows/ci-ios.yml"

permissions:
  contents: read

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          simulator_runtime="com.apple.CoreSimulator.SimRuntime.iOS-${simulator_sdk//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$simulator_runtime" \
                '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid'
          )"

          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -project apps/ios/LanjingQuiz.xcodeproj \
            -scheme LanjingQuiz \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/LanjingQuizDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
