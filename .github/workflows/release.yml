name: Release

# Auto-publishes a release on every push to main (桌面版安装包 + Android apk,
# version auto-bumped to the next patch). Can also be triggered manually from
# the Actions tab ("Release" → Run workflow) or:
#   gh workflow run release.yml -f version=v0.1.0
#
# Inputs (manual runs only; on push they default to false/empty):
#   version      — tag to publish (e.g. v0.1.0); leave empty to auto-bump the
#                  patch number of the latest tag (v0.1.0 → v0.1.1)
#   bank_url     — 题库包的下载地址(留空则自动取「最近一个带题库包的 release」
#                  资产)。题库快照默认随每次 release 分发;数据本身仍不入库
#                  (上游 IP,gitignore),CI 按 工作区 → bank_url → 历史
#                  release 资产的顺序找来源,三条都落空就失败,绝不静默发出
#                  一个没有题库的版本。
#
# Artifacts:
#   1. 桌面版 — Windows 托盘单文件 / macOS .app+dmg / Linux 单文件;内嵌 Bun
#      交叉编译的桌面服务二进制(apps/web/desktop-entry.js),免安装免依赖。
#   2. 题库快照 — LanjingQuiz-bank-<version>.zip,每次发布都附带(来源解析见
#      bank-snapshot job);附带的包会在发布前用 snapshot CLI 校验完整性。
#   3. Android 未签名 release APK — always built (unsigned release 可直接安装);
#      版本号取自发布 tag,versionCode 按
#      major*10000+minor*100+patch 派生(-PversionName/-PversionCode 注入)。

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号,如 v0.1.0(留空自动 +1 patch)"
        required: false
        default: ""
      bank_url:
        description: "题库包下载地址(留空=取最近一个带题库的 release 资产)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: compute
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag --sort=-v:refname | head -1)
            [ -z "$latest" ] && latest="v0.0.0"
            next=$(echo "$latest" | awk -F. '{printf "v%d.%d.%d", $1+0, $2+0, $3+1}')
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: $(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  # Web 桌面版服务二进制:一个 job 交叉编译全部平台(Bun 单文件,内嵌
  # express + public 资源;入口 desktop-entry.js 为裸脚本)。
  web-desktop-services:
    name: Web 桌面服务二进制
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # 设计与实测均针对该版本,锁定避免意外漂移

      # bun build --compile 从 apps/web/node_modules 解析 express;CI 工作区
      # 是全新 checkout,必须先安装依赖(PR 阶段 release.yml 不触发,该错误
      # 只在 main push 的发布运行中暴露)。
      - name: Install web dependencies
        run: npm ci --prefix apps/web

      # public/ 不随 bun 编译产物走(编译产物里的 __dirname 指向编译机源码
      # 路径,用户机器上读不到)——先把它生成成 JS 模块打进二进制,server.js
      # 打包模式下从内存提供静态资源。
      - name: Generate static-asset bundle
        run: node scripts/build-public-bundle.js

      - name: Compile server binaries (all targets)
        run: |
          cd apps/web
          out="$RUNNER_TEMP/servers"
          mkdir -p "$out"
          # 空格分隔才迭代 6 次(冒号分隔会被 bash 当成单次迭代)。
          for target in bun-windows-x64 bun-windows-arm64 bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            bun build --compile --target="$target" ./desktop-entry.js --outfile "$out/$target"
          done
          # bun 对 windows target 自动追加 .exe 后缀(本地实测确认)
          mv "$out/bun-windows-x64.exe" "$out/LanjingQuiz-server.exe"
          mv "$out/bun-windows-arm64.exe" "$out/LanjingQuiz-server-arm64.exe"
          mv "$out/bun-darwin-arm64" "$out/server-darwin-arm64"
          mv "$out/bun-darwin-x64" "$out/server-darwin-x64"
          mv "$out/bun-linux-x64" "$out/LanjingQuiz-linux-x64"
          mv "$out/bun-linux-arm64" "$out/LanjingQuiz-linux-arm64"
          ls -lh "$out"

      # 冒烟:curl 的 JSON 响应在 shell stdout(不在 smoke.log,那是服务日志),
      # 直接管道给 grep 断言(Step 3 的修正形态)。
      - name: Smoke test (linux-x64, same arch as runner)
        run: |
          chmod +x "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64"
          LANJING_LOCAL_DIR="$RUNNER_TEMP/smoke-data" PORT=4399 \
            "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4399/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; cat "$RUNNER_TEMP/smoke.log"; exit 1; }

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"
          if-no-files-found: error

  # Windows 托盘单文件。~100MB 单文件自解压 + 内嵌服务 exe 首次抽取较慢,
  # 冒烟轮询放宽到 120 × 1s = 120s(任务契约:30s 预算偏紧)。
  web-desktop-windows:
    name: Web 桌面 Windows (托盘单文件)
    needs: [version, web-desktop-services]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Copy icon and server exe into the project
        shell: bash
        run: |
          cp assets/desktop/icon.ico apps/desktop/windows/app.ico
          mkdir -p apps/desktop/windows/artifacts
          cp "$RUNNER_TEMP/servers/LanjingQuiz-server.exe" apps/desktop/windows/artifacts/
          cp "$RUNNER_TEMP/servers/LanjingQuiz-server-arm64.exe" apps/desktop/windows/artifacts/

      # -p:Version 需要纯数字版本(带 v 会编译失败/解析回退 0.0.0 → 服务缓存
      # 永不更新):先取 needs.version.outputs.version 再去掉 v 前缀。
      - name: Publish win-x64 single file
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"; ver="${ver#v}"
          cd apps/desktop/windows
          dotnet publish LanjingQuizTray.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$ver" \
            -p:ServerExePath=artifacts/LanjingQuiz-server.exe \
            -o out/win-x64

      - name: Publish win-arm64 single file
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"; ver="${ver#v}"
          cd apps/desktop/windows
          dotnet publish LanjingQuizTray.csproj -c Release -r win-arm64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$ver" \
            -p:ServerExePath=artifacts/LanjingQuiz-server-arm64.exe \
            -o out/win-arm64

      - name: Smoke test (x64)
        shell: bash
        run: |
          cd apps/desktop/windows/out/win-x64
          cp LanjingQuiz.exe "$RUNNER_TEMP/LanjingQuiz.exe"
          (cd "$RUNNER_TEMP" && ./LanjingQuiz.exe) &
          ok=""
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 1
          done
          # 断言前先清理,失败路径不残留进程(干扰同 runner 的后续 job)
          taskkill //F //IM LanjingQuiz.exe //T 2>/dev/null || true
          taskkill //F //IM LanjingQuiz-server.exe //T 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; exit 1; }

      - name: Package deliverables
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deliver"
          cp apps/desktop/windows/out/win-x64/LanjingQuiz.exe "$RUNNER_TEMP/deliver/LanjingQuiz-windows-x64.exe"
          cp apps/desktop/windows/out/win-arm64/LanjingQuiz.exe "$RUNNER_TEMP/deliver/LanjingQuiz-windows-arm64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-windows
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  # macOS:.app + dmg,服务二进制来自 web-desktop-services 的交叉编译产物。
  web-desktop-macos:
    name: Web 桌面 macOS (.app + dmg)
    needs: [version, web-desktop-services]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Assemble .app and dmg
        env:
          LANJING_APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash scripts/assemble-macos-app.sh \
            "$RUNNER_TEMP/servers/server-darwin-arm64" \
            "$RUNNER_TEMP/servers/server-darwin-x64" \
            "$RUNNER_TEMP/deliver"

      - name: Smoke test (server binary, no GUI)
        run: |
          LANJING_LOCAL_DIR="$RUNNER_TEMP/smoke-data" PORT=4398 \
            "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/Resources/LanjingQuiz-server" \
            > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4398/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; cat "$RUNNER_TEMP/smoke.log"; exit 1; }

      # 锁住 Universal 承诺:lipo 双架构为硬性断言,vtool 的 minos 为参考性
      # 断言(失败不阻塞)。
      - name: Verify launcher structure (universal + minos)
        run: |
          lipo -info "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" | grep -q "x86_64"
          lipo -info "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" | grep -q "arm64"
          vtool -show-build "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" 2>/dev/null | grep -q "minos 12.0" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-macos
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  web-desktop-linux:
    name: Web 桌面 Linux (单文件)
    needs: [version, web-desktop-services]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Package deliverables
        run: |
          mkdir -p "$RUNNER_TEMP/deliver"
          chmod +x "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" "$RUNNER_TEMP/servers/LanjingQuiz-linux-arm64"
          cp "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" "$RUNNER_TEMP/deliver/"
          cp "$RUNNER_TEMP/servers/LanjingQuiz-linux-arm64" "$RUNNER_TEMP/deliver/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-linux
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  # 题库快照:随 release 分发(iOS App 里「我的 > 题库 > 导入题库」直接吃这个包)。
  # 数据本身仍不入库(gitignore,上游 IP),所以按下面的顺序解析来源:
  #   1. 工作区里有 apps/bank/data     → 用 snapshot CLI 现场打包(可复现,首选)
  #   2. 手动运行且给了 bank_url        → 直接下载
  #   3. 否则取最近一个带题库包的 release 资产(首次需要 bootstrap 传一次)
  # 三条都落空就 fail:宁可让发布停下,也不要静默发出一个没有题库的版本。
  # 无论走哪条路,发布前都用 snapshot CLI 校验一遍(CRC32/长度/sha256/manifest 对齐)。
  bank-snapshot:
    name: 题库快照
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve bank package
        env:
          GH_TOKEN: ${{ github.token }}
          BANK_URL: ${{ inputs.bank_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/bank"
          if [ -d apps/bank/data ] && [ -n "$(find apps/bank/data -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            echo "来源: 工作区 apps/bank/data(现场打包)"
            node apps/bank/scripts/snapshot-bank.js --out "$RUNNER_TEMP/bank/lanjing-bank.zip"
            exit 0
          fi
          if [ -n "$BANK_URL" ]; then
            echo "来源: bank_url"
            curl -fsSL "$BANK_URL" -o "$RUNNER_TEMP/bank/lanjing-bank.zip"
            exit 0
          fi
          prev=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qE 'bank.*\.zip$'; then
              prev="$tag"
              break
            fi
          done < <(gh release list --limit 30 --json tagName -q '.[].tagName')
          if [ -n "$prev" ]; then
            echo "来源: release $prev 的题库资产"
            gh release download "$prev" --pattern '*bank*.zip' --dir "$RUNNER_TEMP/bank"
            # 资产名可能不是 lanjing-bank.zip(历史版本),统一改名后再校验。
            found=""
            for f in "$RUNNER_TEMP"/bank/*.zip; do
              [ -f "$f" ] && found="$f" && break
            done
            if [ -z "$found" ]; then
              echo "::error::release $prev 里没有下到题库包"
              exit 1
            fi
            [ "$found" = "$RUNNER_TEMP/bank/lanjing-bank.zip" ] || mv "$found" "$RUNNER_TEMP/bank/lanjing-bank.zip"
            exit 0
          fi
          echo "::error::找不到题库包来源:工作区没有 apps/bank/data,没给 bank_url,历史 release 里也没有题库资产。先手动 bootstrap 一次:gh release upload <tag> lanjing-bank-*.zip --clobber"
          exit 1

      - name: Verify package
        run: |
          ls -lh "$RUNNER_TEMP/bank/lanjing-bank.zip"
          node apps/bank/scripts/snapshot-bank.js --verify "$RUNNER_TEMP/bank/lanjing-bank.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-snapshot
          path: "${{ runner.temp }}/bank/lanjing-bank.zip"
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [version, web-desktop-services, web-desktop-windows, web-desktop-macos, web-desktop-linux, bank-snapshot]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: "${{ runner.temp }}/assets"
          merge-multiple: true

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # web-desktop-services 的 4 个内部中间产物只作打包输入,不上 release 附件
          rm -f "${{ runner.temp }}"/assets/LanjingQuiz-server.exe \
                "${{ runner.temp }}"/assets/LanjingQuiz-server-arm64.exe \
                "${{ runner.temp }}"/assets/server-darwin-arm64 \
                "${{ runner.temp }}"/assets/server-darwin-x64
          # 题库包同样平台化命名(bank-snapshot 的解析按 *bank*.zip 匹配)
          if [ -f "${{ runner.temp }}/assets/lanjing-bank.zip" ]; then
            mv "${{ runner.temp }}/assets/lanjing-bank.zip" \
               "${{ runner.temp }}/assets/LanjingQuiz-bank-${{ needs.version.outputs.version }}.zip"
          fi
          assets=()
          for f in "${{ runner.temp }}"/assets/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::warning::没有可发布的产物(桌面版产物总是存在;签名 ipa 需要签名密钥)"
          fi
          gh release create "${{ needs.version.outputs.version }}" \
            "${assets[@]}" \
            --title "蓝鲸助手 ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version }}"
