name: Release

# Auto-publishes a release on every push to main (桌面版安装包 + 未签名 ipa,
# version auto-bumped to the next patch). Can also be triggered manually from
# the Actions tab ("Release" → Run workflow) or:
#   gh workflow run release.yml -f version=v0.1.0
#
# Inputs (manual runs only; on push they default to false/empty):
#   version      — tag to publish (e.g. v0.1.0); leave empty to auto-bump the
#                  patch number of the latest tag (v0.1.0 → v0.1.1)
#   include_bank — packages the question-bank snapshot (apps/bank/data) into
#                  the release. Off on auto-publish: the bank data is
#                  intentionally gitignored as upstream IP and is not present
#                  in the CI workspace — enabling this fails fast with a
#                  clear message unless the data is available.
#   include_ipa  — additionally build a signed ADHOC ipa (requires the
#                  signing secrets below; fails fast with a clear message
#                  when they are missing). The unsigned ipa is always built.
#
# Artifacts:
#   1. 桌面版 — Windows 托盘单文件 / macOS .app+dmg / Linux 单文件;内嵌 Bun
#      交叉编译的桌面服务二进制(apps/web/desktop-entry.js),免安装免依赖。
#   2. iOS 未签名 ipa — always built (CODE_SIGNING_ALLOWED=NO); installable
#      on real devices only after re-signing with a free Apple ID via
#      Sideloadly/AltStore (instructions attached in the release).
#   3. iOS 签名 ipa (ADHOC) — additionally built and signed when the signing
#      secrets are configured; that job self-skips otherwise.
#   4. 题库快照 — only when include_bank=true AND the data exists in the
#      workspace (it does not in CI; see the bank-snapshot job).
#
# iOS signing secrets (add in repo Settings → Secrets and variables → Actions
# when you have an Apple Developer certificate):
#   IOS_CERT_BASE64          — export.p12, base64-encoded
#   IOS_CERT_PASSWORD        — p12 export password
#   IOS_PROVISIONING_BASE64  — ADHOC provisioning profile (.mobileprovision),
#                              base64-encoded, for bundle id com.qzh.lanjingquiz
#   DEVELOPMENT_TEAM         — team ID (e.g. AB12CD34EF)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号,如 v0.1.0(留空自动 +1 patch)"
        required: false
        default: ""
      include_bank:
        description: "附带题库快照(公开性定论后启用)"
        required: false
        default: false
        type: boolean
      include_ipa:
        description: "构建并附带签名 ipa(需先配置签名 secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: compute
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag --sort=-v:refname | head -1)
            [ -z "$latest" ] && latest="v0.0.0"
            next=$(echo "$latest" | awk -F. '{printf "v%d.%d.%d", $1+0, $2+0, $3+1}')
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: $(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  # Web 桌面版服务二进制:一个 job 交叉编译全部平台(Bun 单文件,内嵌
  # express + public 资源;入口 desktop-entry.js 为裸脚本)。
  web-desktop-services:
    name: Web 桌面服务二进制
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # 设计与实测均针对该版本,锁定避免意外漂移

      # bun build --compile 从 apps/web/node_modules 解析 express;CI 工作区
      # 是全新 checkout,必须先安装依赖(PR 阶段 release.yml 不触发,该错误
      # 只在 main push 的发布运行中暴露)。
      - name: Install web dependencies
        run: npm ci --prefix apps/web

      # public/ 不随 bun 编译产物走(编译产物里的 __dirname 指向编译机源码
      # 路径,用户机器上读不到)——先把它生成成 JS 模块打进二进制,server.js
      # 打包模式下从内存提供静态资源。
      - name: Generate static-asset bundle
        run: node scripts/build-public-bundle.js

      - name: Compile server binaries (all targets)
        run: |
          cd apps/web
          out="$RUNNER_TEMP/servers"
          mkdir -p "$out"
          # 空格分隔才迭代 6 次(冒号分隔会被 bash 当成单次迭代)。
          for target in bun-windows-x64 bun-windows-arm64 bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            bun build --compile --target="$target" ./desktop-entry.js --outfile "$out/$target"
          done
          # bun 对 windows target 自动追加 .exe 后缀(本地实测确认)
          mv "$out/bun-windows-x64.exe" "$out/LanjingQuiz-server.exe"
          mv "$out/bun-windows-arm64.exe" "$out/LanjingQuiz-server-arm64.exe"
          mv "$out/bun-darwin-arm64" "$out/server-darwin-arm64"
          mv "$out/bun-darwin-x64" "$out/server-darwin-x64"
          mv "$out/bun-linux-x64" "$out/LanjingQuiz-linux-x64"
          mv "$out/bun-linux-arm64" "$out/LanjingQuiz-linux-arm64"
          ls -lh "$out"

      # 冒烟:curl 的 JSON 响应在 shell stdout(不在 smoke.log,那是服务日志),
      # 直接管道给 grep 断言(Step 3 的修正形态)。
      - name: Smoke test (linux-x64, same arch as runner)
        run: |
          chmod +x "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64"
          LANJING_LOCAL_DIR="$RUNNER_TEMP/smoke-data" PORT=4399 \
            "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4399/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; cat "$RUNNER_TEMP/smoke.log"; exit 1; }

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"
          if-no-files-found: error

  # Windows 托盘单文件。~100MB 单文件自解压 + 内嵌服务 exe 首次抽取较慢,
  # 冒烟轮询放宽到 120 × 1s = 120s(任务契约:30s 预算偏紧)。
  web-desktop-windows:
    name: Web 桌面 Windows (托盘单文件)
    needs: [version, web-desktop-services]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Copy icon and server exe into the project
        shell: bash
        run: |
          cp assets/desktop/icon.ico apps/desktop/windows/app.ico
          mkdir -p apps/desktop/windows/artifacts
          cp "$RUNNER_TEMP/servers/LanjingQuiz-server.exe" apps/desktop/windows/artifacts/
          cp "$RUNNER_TEMP/servers/LanjingQuiz-server-arm64.exe" apps/desktop/windows/artifacts/

      # -p:Version 需要纯数字版本(带 v 会编译失败/解析回退 0.0.0 → 服务缓存
      # 永不更新):先取 needs.version.outputs.version 再去掉 v 前缀。
      - name: Publish win-x64 single file
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"; ver="${ver#v}"
          cd apps/desktop/windows
          dotnet publish LanjingQuizTray.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$ver" \
            -p:ServerExePath=artifacts/LanjingQuiz-server.exe \
            -o out/win-x64

      - name: Publish win-arm64 single file
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"; ver="${ver#v}"
          cd apps/desktop/windows
          dotnet publish LanjingQuizTray.csproj -c Release -r win-arm64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$ver" \
            -p:ServerExePath=artifacts/LanjingQuiz-server-arm64.exe \
            -o out/win-arm64

      - name: Smoke test (x64)
        shell: bash
        run: |
          cd apps/desktop/windows/out/win-x64
          cp LanjingQuiz.exe "$RUNNER_TEMP/LanjingQuiz.exe"
          (cd "$RUNNER_TEMP" && ./LanjingQuiz.exe) &
          ok=""
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 1
          done
          # 断言前先清理,失败路径不残留进程(干扰同 runner 的后续 job)
          taskkill //F //IM LanjingQuiz.exe //T 2>/dev/null || true
          taskkill //F //IM LanjingQuiz-server.exe //T 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; exit 1; }

      - name: Package deliverables
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deliver"
          cp apps/desktop/windows/out/win-x64/LanjingQuiz.exe "$RUNNER_TEMP/deliver/LanjingQuiz-windows-x64.exe"
          cp apps/desktop/windows/out/win-arm64/LanjingQuiz.exe "$RUNNER_TEMP/deliver/LanjingQuiz-windows-arm64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-windows
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  # macOS:.app + dmg,服务二进制来自 web-desktop-services 的交叉编译产物。
  web-desktop-macos:
    name: Web 桌面 macOS (.app + dmg)
    needs: [version, web-desktop-services]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Assemble .app and dmg
        env:
          LANJING_APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash scripts/assemble-macos-app.sh \
            "$RUNNER_TEMP/servers/server-darwin-arm64" \
            "$RUNNER_TEMP/servers/server-darwin-x64" \
            "$RUNNER_TEMP/deliver"

      - name: Smoke test (server binary, no GUI)
        run: |
          LANJING_LOCAL_DIR="$RUNNER_TEMP/smoke-data" PORT=4398 \
            "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/Resources/LanjingQuiz-server" \
            > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4398/api/status | grep -q '"loggedIn":false'; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke failed"; cat "$RUNNER_TEMP/smoke.log"; exit 1; }

      # 锁住 Universal 承诺:lipo 双架构为硬性断言,vtool 的 minos 为参考性
      # 断言(失败不阻塞)。
      - name: Verify launcher structure (universal + minos)
        run: |
          lipo -info "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" | grep -q "x86_64"
          lipo -info "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" | grep -q "arm64"
          vtool -show-build "$RUNNER_TEMP/deliver/LanjingQuiz.app/Contents/MacOS/LanjingQuiz" 2>/dev/null | grep -q "minos 12.0" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-macos
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  web-desktop-linux:
    name: Web 桌面 Linux (单文件)
    needs: [version, web-desktop-services]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: web-servers
          path: "${{ runner.temp }}/servers"

      - name: Package deliverables
        run: |
          mkdir -p "$RUNNER_TEMP/deliver"
          chmod +x "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" "$RUNNER_TEMP/servers/LanjingQuiz-linux-arm64"
          cp "$RUNNER_TEMP/servers/LanjingQuiz-linux-x64" "$RUNNER_TEMP/deliver/"
          cp "$RUNNER_TEMP/servers/LanjingQuiz-linux-arm64" "$RUNNER_TEMP/deliver/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-desktop-linux
          path: "${{ runner.temp }}/deliver"
          if-no-files-found: error

  # Always built: unsigned Release ipa. Not directly installable — the
  # attached install notes explain re-signing with a free Apple ID
  # (Sideloadly/AltStore, 7-day refresh).
  ios-unsigned:
    name: iOS 未签名 ipa
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Release without code signing
        run: |
          xcodebuild build \
            -project apps/ios/LanjingQuiz.xcodeproj \
            -scheme LanjingQuiz \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/unsigned-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned ipa and install notes
        run: |
          app="$RUNNER_TEMP/unsigned-dd/Build/Products/Release-iphoneos/LanjingQuiz.app"
          if [ ! -d "$app" ]; then
            echo "::error::未找到构建产物 $app"
            exit 1
          fi
          pkg="$RUNNER_TEMP/assets"
          mkdir -p "$pkg/Payload"
          cp -R "$app" "$pkg/Payload/"
          cd "$pkg"
          zip -r -q "LanjingQuiz-unsigned-${{ needs.version.outputs.version }}.ipa" Payload
          # ASCII filename on purpose: upload/download-artifact mangles
          # non-ASCII names through the artifact backend.
          cat > "ipa-install-notes.txt" <<'EOF'
          未签名 ipa(LanjingQuiz-unsigned-*.ipa)不能直接安装。它没有签名,
          需要用免费工具 + 你自己的 Apple ID 签名后装到真机(每 7 天重新签名一次):

          1. 下载 Sideloadly(https://sideloadly.io,macOS/Windows)或 AltStore;
          2. iPhone 连接电脑并解锁;
          3. Sideloadly 中选择本 ipa,填入你的 Apple ID 和密码(仅用于签名,
             官方工具本地处理,不上传);
          4. 点击 Start;完成后到手机:设置 → 通用 → VPN 与设备管理 →
             开发者 App → 信任;
          5. 信任后即可使用;7 天后过期需重新签名。

          若 release 里另有 LanjingQuiz-*.ipa(带签名,ADHOC),那是已签好的
          正式包,直接安装即可,无需本步骤。
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: "${{ runner.temp }}/assets"
          if-no-files-found: error

  # Signed ADHOC ipa, opt-in via the include_ipa input (job-level `if` cannot
  # read secrets/env, so the decision comes from the dispatch inputs). The
  # first step fails fast with a clear message when the signing secrets are
  # missing; without a certificate no installable signed ipa can be produced.
  ios-ipa:
    name: iOS 签名 ipa (ADHOC)
    if: inputs.include_ipa == 'true'
    env:
      IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISIONING_BASE64: ${{ secrets.IOS_PROVISIONING_BASE64 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify signing secrets are configured
        run: |
          missing=""
          for var in IOS_CERT_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_BASE64 DEVELOPMENT_TEAM; do
            [ -n "${!var}" ] || missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::勾选了 include_ipa 但签名 secrets 未配置:$missing。请先在仓库 Settings → Secrets and variables → Actions 配置后再发布。"
            exit 1
          fi

      - name: Import signing certificate into a build keychain
        run: |
          echo "$IOS_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install provisioning profile
        run: |
          echo "$IOS_PROVISIONING_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          uuid=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - name: Archive (Release configuration)
        run: |
          xcodebuild archive \
            -project apps/ios/LanjingQuiz.xcodeproj \
            -scheme LanjingQuiz \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LanjingQuiz.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates

      - name: Export ADHOC ipa
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LanjingQuiz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "${{ runner.temp }}/ipa/*.ipa"
          if-no-files-found: error

  # Reserved slot for the question-bank snapshot. The data is gitignored, so
  # it is normally absent from the CI workspace — the job then fails with a
  # clear message instead of silently producing an empty release. Once the
  # public/private decision is made (see README), either commit the data into
  # a private fork or upload the locally packaged zip manually:
  #   zip -r 题库导出-vX.Y.Z.zip apps/bank/data
  #   gh release upload <tag> 题库导出-vX.Y.Z.zip
  bank-snapshot:
    name: 题库快照 (默认关闭)
    needs: version
    if: inputs.include_bank == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify bank data is present in the workspace
        run: |
          if [ ! -d apps/bank/data ] || [ -z "$(ls -A apps/bank/data 2>/dev/null)" ]; then
            echo "::error::题库数据不在 CI 工作区(gitignore)。要么改用私有仓库并纳入数据,要么在本地打包后手动 gh release upload。"
            exit 1
          fi

      - name: Package bank snapshot
        run: |
          zip -r -q "题库导出-${{ needs.version.outputs.version }}.zip" apps/bank/data

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-snapshot
          path: "题库导出-${{ needs.version.outputs.version }}.zip"
          if-no-files-found: error

  release:
    name: 创建 Release
    needs: [version, web-desktop-services, web-desktop-windows, web-desktop-macos, web-desktop-linux, ios-unsigned, ios-ipa, bank-snapshot]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: "${{ runner.temp }}/assets"
          merge-multiple: true

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # web-desktop-services 的 4 个内部中间产物只作打包输入,不上 release 附件
          rm -f "${{ runner.temp }}"/assets/LanjingQuiz-server.exe \
                "${{ runner.temp }}"/assets/LanjingQuiz-server-arm64.exe \
                "${{ runner.temp }}"/assets/server-darwin-arm64 \
                "${{ runner.temp }}"/assets/server-darwin-x64
          assets=()
          for f in "${{ runner.temp }}"/assets/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::warning::没有可发布的产物(桌面版产物总是存在;签名 ipa 需要签名密钥)"
          fi
          gh release create "${{ needs.version.outputs.version }}" \
            "${assets[@]}" \
            --title "蓝鲸助手 ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version }}"
