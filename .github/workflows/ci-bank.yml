name: CI Bank

# The workflow always runs and the Bank job itself is conditionally skipped:
# GitHub auto-passes required checks whose job was skipped, but it does NOT
# auto-pass checks whose workflow never ran (path-filtered runs). Without
# this, a PR touching only ios/web would stay BLOCKED waiting for the "Bank"
# check forever.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bank: ${{ steps.filter.outputs.bank }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect bank changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bank:
              - "apps/bank/**"
              - ".github/workflows/ci-bank.yml"

  bank:
    name: Bank
    needs: changes
    if: needs.changes.outputs.bank == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The bank tool is dependency-free (node:crypto/fs/path + global fetch
      # only) — no install step, no package-lock.json.
      - name: Check bank tool syntax
        run: npm --prefix apps/bank run check

      - name: Run bank tool tests
        run: npm --prefix apps/bank test
