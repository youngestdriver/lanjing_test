name: LanjingQuiz
options:
  bundleIdPrefix: com.qzh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_TESTABILITY: YES
targets:
  LanjingQuiz:
    type: application
    platform: iOS
    sources:
      - LanjingQuiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qzh.lanjingquiz
        PRODUCT_NAME: LanjingQuiz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "蓝鲸助手"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LanjingQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LanjingQuizTests
    dependencies:
      - target: LanjingQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: LanjingQuizTests
        PRODUCT_BUNDLE_IDENTIFIER: com.qzh.lanjingquiz.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LanjingQuiz.app/LanjingQuiz"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LanjingQuiz:
    build:
      targets:
        LanjingQuiz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LanjingQuizTests
